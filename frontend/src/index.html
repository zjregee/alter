<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- 左侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="view-switcher">
                    <button class="view-btn active" data-view="chat">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 20v-6m0-4V4m0 6h6m-6 0H6"></path>
                        </svg>
                        <span>Chat</span>
                    </button>
                    <button class="view-btn" data-view="notifications">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 11a9 9 0 0 1 9 9"></path>
                            <path d="M4 4a16 16 0 0 1 16 16"></path>
                            <circle cx="5" cy="19" r="1"></circle>
                        </svg>
                        <span>Feed</span>
                    </button>
                </div>
            </div>

            <div class="sidebar-content">
                <div class="view-content active" id="chat-view-sidebar">
                    <div class="sidebar-actions">
                        <button class="icon-btn new-thread-btn" title="新建线程">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                        </button>
                        <button class="icon-btn search-btn" title="搜索">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                        </button>
                        <input class="thread-search" type="text" placeholder="Search threads..." aria-label="Search threads">
                    </div>
                    <div class="thread-list">
                        <!-- 线程列表将通过 JavaScript 动态加载 -->
                    </div>
                </div>
                <div class="view-content" id="notifications-view-sidebar">
                    <div class="feed-topics-list">
                        <!-- Feed topics will be loaded here -->
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar-resizer" role="separator" aria-orientation="vertical"></div>

        <!-- 右侧主内容区 -->
        <div class="main-content">
            <div class="view-content active" id="chat-view-main">
                <div class="chat-messages">
                    <!-- 消息内容将通过 JavaScript 动态加载 -->
                </div>
                <div class="chat-input-container">
                    <div class="input-wrapper">
                        <textarea class="chat-input" placeholder="Type a message..." rows="1"></textarea>
                        <div class="input-actions">
                            <div class="workspace-switcher">
                                <button class="workspace-toggle" type="button" aria-haspopup="listbox" aria-expanded="false">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M3 7a2 2 0 0 1 2-2h3l2 2h9a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                                    </svg>
                                    <span class="workspace-toggle-label">Workspace</span>
                                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>
                                </button>
                                <div class="workspace-dropdown" aria-hidden="true">
                                    <div class="workspace-header">
                                        <div>
                                            <div class="workspace-title">Workspace</div>
                                            <div class="workspace-subtitle">All tool operations will use this directory as working directory</div>
                                        </div>
                                        <button class="workspace-refresh" type="button" title="Reset workspace">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <polyline points="23 4 23 10 17 10"></polyline>
                                                <polyline points="1 20 1 14 7 14"></polyline>
                                                <path d="M3.51 9a9 9 0 0 1 14.13-3.36L23 10"></path>
                                                <path d="M20.49 15a9 9 0 0 1-14.13 3.36L1 14"></path>
                                            </svg>
                                        </button>
                                    </div>
                                    <div class="workspace-list" role="listbox"></div>
                                    <button class="workspace-select-btn" type="button">
                                        <span class="workspace-select-icon">+</span>
                                        Select Directory...
                                    </button>
                                </div>
                            </div>
                            <div class="model-switcher">
                                <button class="model-toggle" type="button" aria-haspopup="listbox" aria-expanded="false">
                                    <span class="model-toggle-label">Select model</span>
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>
                                </button>
                                <div class="model-dropdown" aria-hidden="true">
                                    <div class="model-search">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <circle cx="11" cy="11" r="8"></circle>
                                            <path d="m21 21-4.35-4.35"></path>
                                        </svg>
                                        <input class="model-search-input" type="text" placeholder="Search models..." aria-label="Search models">
                                    </div>
                                    <div class="model-list" role="listbox"></div>
                                </div>
                            </div>
                            <button class="send-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="view-content" id="notifications-view-main">
                <div class="feed-articles-list">
                    <!-- Feed articles will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
